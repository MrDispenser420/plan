<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zajęć – semestr V</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ln:#e4e0d6;--ks:#b5532f;--ksb:#f6e3da;--zd:#2f7a4f;--zdb:#dcefe3;--ac:#1d1d1b;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--card:#222220;--tx:#f0eee8;--mut:#a09e96;--ln:#34332f;--ks:#e58a63;--ksb:#3a2820;--zd:#6fc08f;--zdb:#1f3327;--ac:#f0eee8;--acx:#171715;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171715;--card:#222220;--tx:#f0eee8;--mut:#a09e96;--ln:#34332f;--ks:#e58a63;--ksb:#3a2820;--zd:#6fc08f;--zdb:#1f3327;--ac:#f0eee8;--acx:#171715;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px 8px;z-index:5;border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg button,.chip{border:0;background:transparent;color:var(--tx);padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx)}
.chip{border:1px solid var(--ln);border-radius:20px;padding:5px 12px}
.chip.on{background:var(--ac);color:var(--acx)}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
.day{margin-top:16px}
.dh{font-size:13px;font-weight:600;color:var(--mut);text-transform:capitalize;margin-bottom:6px}
.dh.today{color:var(--ks)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-left:5px solid;border-radius:12px;padding:10px 12px;margin-bottom:6px;font:inherit;color:inherit;cursor:pointer}
.card{border-left-color:var(--c,var(--ln))}
.card.past{opacity:.5}
.tm{font-size:13px;color:var(--mut)}
.nm{font-weight:600}
.tp{font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:1px}
.tag{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.brk{background:transparent;border:1px dashed var(--ln);border-radius:12px;padding:10px 12px;color:var(--mut);font-size:14px;text-align:center;margin:6px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:19px}
.sheet .sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px}
.t{padding:8px 0;border-top:1px solid var(--ln)}
.t.me{font-weight:600}
.t a{color:var(--ks);word-break:break-all}
.x{width:100%;margin-top:16px;padding:11px;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.note{font-size:13px;color:var(--mut);margin-top:20px}
.lst{display:none}
</style>
</head>
<body>
<header>
<h1>Plan zajęć · semestr V</h1>
<div class="row">
<div class="seg" id="gs"><button data-g="a">Grupa 1a</button><button data-g="b">Grupa 1b</button></div>
<div class="seg" id="vs"><button data-v="plan">Plan</button><button data-v="prow">Prowadzący</button></div>
</div>
<div class="row" id="fs"><select id="fsel" class="chip"></select><button class="chip" id="td">Dziś</button></div>
</header>
<main>
<div id="plan"></div>
<div id="prow" class="lst"></div>
<p class="note">Rok akademicki 2026/2027, UP Lublin. Ferie zimowe: 21.12 – 06.01, sesja: 01.02 – 12.02.2027. 28.01 (czw.) realizowane są zajęcia z poniedziałku, 29.01 (pt.) – ze środy.</p>
</main>
<div id="ov"><div class="sheet" id="sh"></div></div>
<script>
var S={
KS:{n:'Kuchnie świata',c:'#c8643b',T:[
{n:'dr Bożena Sosnowska',k:'BS',m:'bozena.sosnowska@up.edu.pl'},
{n:'prof. dr hab. Marta Wesołowska-Trojanowska',k:'MWT',m:'marta.wesolowska-trojanowska@up.edu.pl'}]},
ZD:{n:'Żywienie dietetyczne w zakładach gastronomicznych',c:'#3f9060',T:[
{n:'dr Monika Michalak-Majewska',k:'',m:'monika.michalak@up.edu.pl'}]}
};
var KOW={n:'prof. dr hab. Radosław Kowalski',k:'',m:'radoslaw.kowalski@up.edu.pl'};
Object.assign(S,{
PZ:{n:'Projektowanie zakładów gastronomicznych',c:'#4a7fc1',T:[{n:'prof. dr hab. inż. Aldona Sobota',k:'',m:'kontakt na Teams'},{n:'dr Dorota Teterycz',k:'',m:'kontakt na Teams'}]},
ZJ:{n:'Zarządzanie jakością w gastronomii',c:'#8a63b8',T:[{n:'prof. dr inż. Agnieszka Latoch',k:'',m:'agnieszka.latoch@up.edu.pl'}]},
TS:{n:'Tłuszcze specjalne',c:'#c49a2a',T:[KOW]},
HA:{n:'Historia aromatów i przypraw',c:'#a8567a',T:[KOW]},
TI:{n:'Technologie informacyjne',c:'#2b9a9a',T:[{n:'prof. dr hab. Renata Różyło',k:'',m:'renata.rozylo@up.edu.pl'}]},
CH:{n:'Chłodnictwo i zamrażalnictwo w gastronomii',c:'#6b7a8f',T:[{n:'prof. dr hab. inż. Katarzyna Kozłowicz',k:'',m:'katarzyna.kozlowicz@up.edu.pl'}]}});
var OTHER=[
['Zarządzanie jakością w gastronomii','prof. dr inż. Agnieszka Latoch','agnieszka.latoch@up.edu.pl'],
['Tłuszcze specjalne & Historia aromatów i przypraw','prof. dr hab. Radosław Kowalski','radoslaw.kowalski@up.edu.pl'],
['Projektowanie zakładów gastronomicznych','prof. dr hab. inż. Aldona Sobota; dr Dorota Teterycz','kontakt na Teams'],
['Kuchnie świata','dr Bożena Sosnowska; prof. dr hab. Marta Wesołowska-Trojanowska','bozena.sosnowska@up.edu.pl'],
['Żywienie dietetyczne w zakładach gastronomicznych','dr Monika Michalak-Majewska','monika.michalak@up.edu.pl'],
['Technologie informacyjne','prof. dr hab. Renata Różyło','renata.rozylo@up.edu.pl'],
['Chłodnictwo i zamrażalnictwo w gastronomii','prof. dr hab. inż. Katarzyna Kozłowicz','katarzyna.kozlowicz@up.edu.pl']];
var A='1 godz. aud.',L='lab.';
var Z1={a:'12:15–15:00',b:'15:00–18:00'};
function k(d,t,tp,kind,who,note){return {s:'KS',d:d,t:t,tp:tp,kind:kind,who:who,note:note||''}}
function z(d,t,tp,kind,who,note){return {s:'ZD',d:d,t:t,tp:tp,kind:kind,who:who||'',note:note||''}}
var E=[
k('2026-10-01','9:00–9:45','Zajęcia organizacyjne','aud.','BS'),
k('2026-10-08',{b:'9:00–11:15',a:'11:15–13:30'},'Zboża i nabiał w kuchniach świata','lab.','BS'),
k('2026-10-22',{b:'9:00–12:00',a:'12:00–15:00'},'Warzywa strączkowe w kuchniach świata + Erasmus','aud. + lab.','BS'),
k('2026-10-29',{b:'9:00–12:00',a:'12:00–15:00'},'Wypieki w kuchniach świata','lab.','BS'),
k('2026-11-19',{b:'9:00–12:00',a:'12:00–15:00'},'Pierogi, makarony, kluski w kuchniach świata','lab.','MWT'),
k('2026-12-03',{b:'9:45–12:00',a:'12:00–14:15'},'Desery, napoje w kuchniach świata','lab.','MWT'),
k('2026-12-17',{b:'9:45–12:00',a:'12:00–14:15'},'Potrawy świąteczne różnych kuchni','lab.','MWT'),
k('2027-01-14','9:00–12:00','Prezentacje studentów nt. kuchni świata + Erasmus','aud.','BS'),
k('2027-01-21','9:00–12:00','Prezentacje studentów nt. kuchni świata + Erasmus','aud.','BS'),
z('2026-10-06','11:30–13:00','Wykład','wykład'),
z('2026-10-14',Z1,'Ćwiczenia','ćwiczenia'),
z('2026-10-20','11:30–13:00','Wykład','wykład'),
z('2026-10-28',Z1,'Ćwiczenia','ćwiczenia'),
z('2026-11-03','11:30–13:00','Wykład','wykład'),
z('2026-11-04',Z1,'Ćwiczenia','ćwiczenia','Łukasz'),
z('2026-11-17','11:30–13:00','Wykład','wykład'),
z('2026-11-25',Z1,'Ćwiczenia','ćwiczenia','Patryk'),
z('2026-12-01','11:30–13:00','Wykład','wykład'),
z('2026-12-09',Z1,'Ćwiczenia','ćwiczenia','Patryk','Praca samodzielna na ocenę – U1: student potrafi zaplanować jadłospis dostosowany do wymogów określonej diety leczniczej (ćwiczenie PS).'),
z('2026-12-15','11:30–13:00','Wykład – WR (oznaczenie z planu)','wykład'),
z('2027-01-12','11:30–13:00','Wykład – WR (oznaczenie z planu)','wykład'),
z('2027-01-13',Z1,'Ćwiczenia – WR (oznaczenie z planu)','ćwiczenia'),
z('2027-01-26','11:30–13:00','Zaliczenie wykładu','zaliczenie'),
z('2027-01-27',Z1,'Ćwiczenia – WR (oznaczenie z planu)','ćwiczenia'),
z('2027-01-29',Z1,'Prezentacja samodzielna – wytyczne dot. żywienia dostosowanego do potrzeb dietetycznych odbiorcy','ćwiczenia (zajęcia ze środy)','','Prezentacja ustna podczas zajęć + wersja elektroniczna na Teams. Praca samodzielna na ocenę – U2: student potrafi zastosować technologie i techniki wytwarzania potraw dostosowane do potrzeb żywienia dietetycznego (projekt).')
];
E.forEach(function(e){if(!e.room)e.room=e.s==='KS'?'Pracownia Gastronomiczna SKR':(e.kind==='wykład'||e.kind==='zaliczenie'?'B SKR':'Pracownia Gastronomiczna SKR (wymiennie sala 6 SKR)')});
var NT='Zajęcia cykliczne z planu tygodniowego – załączniki nie podają dokładnych dat, sprawdź ewentualne wyjątki.';
var W=[

[1,'ZJ','11:30–13:00','Wykład','wykład','A SKR'],
[1,'TS','13:15–14:45','Wykład','wykład','A SKR'],
[1,'HA','15:00–17:00','Wykład','wykład','A SKR'],
[2,'PZ','8:00–9:30','Wykład','wykład','B SKR'],
[2,'KS','9:45–11:15','Wykład','wykład','B SKR'],
[2,'CH',{a:'16:15–17:45',b:'14:30–16:00'},'Ćwiczenia','ćwiczenia','359 CIW'],
[2,'CH','18:00–18:45','Wykład','wykład','Aula 257 CIW'],
[3,'ZJ',{a:'8:00–9:30',b:'9:45–11:15'},'Ćwiczenia','ćwiczenia','6 SKR'],
[3,'PZ',{a:'9:45–11:15',b:'11:30–13:00'},'Ćwiczenia','ćwiczenia','8 SKR']];
(function(){
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var end=new Date('2027-01-29T12:00:00');
for(var d=new Date('2026-10-01T12:00:00');d<=end;d.setDate(d.getDate()+1)){
var x=iso(d),wd=d.getDay();
if((x>='2026-12-19'&&x<='2027-01-06')||x==='2026-11-11')continue;
if(x==='2027-01-28')wd=1;if(x==='2027-01-29')wd=3;
W.forEach(function(w){if(w[0]===wd)E.push({s:w[1],d:x,t:w[2],tp:w[3],kind:w[4],who:'',note:NT,room:w[5]})});
if(wd===2)E.push({s:'TI',d:x,t:{a:'14:30–16:00',b:'16:15–17:45'},tp:'Ćwiczenia',kind:'ćwiczenia',who:'',note:'',room:'372 CIW'})}
})();
function st(e){var m=tm(e).match(/(\d+):(\d+)/);return +m[1]*60+ +m[2]}
var B=[{d:'2026-12-21',t:'Ferie zimowe: 21.12.2026 – 06.01.2027'},{d:'2027-02-01',t:'Zimowa sesja egzaminacyjna: 01.02 – 12.02.2027'}];
var g='a',f='all',v='plan';
try{g=localStorage.getItem('g')||'a'}catch(e){}
var $=function(i){return document.getElementById(i)};
function tm(e){return typeof e.t==='string'?e.t:e.t[g]}
function fd(d){return new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function today(){var n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2)}
function render(){
var td=today(),items=[];
E.forEach(function(e,i){if(f==='all'||f===e.s)items.push({d:e.d,e:e,i:i})});
if(f==='all')B.forEach(function(b){items.push({d:b.d,b:b})});
items.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.e&&b.e?st(a.e)-st(b.e):0)});
var h='',last='',nx=false;
items.forEach(function(it){
if(it.b){h+='<div class="brk">'+it.b.t+'</div>';return}
if(it.d!==last){last=it.d;var isn=!nx&&it.d>=td;if(isn)nx=true;
h+='<div class="day"'+(isn?' id="next"':'')+'><div class="dh'+(it.d===td?' today':'')+'">'+fd(it.d)+(it.d===td?' · dziś':'')+'</div></div>'}
var e=it.e,s=S[e.s];
h+='<button class="card'+(it.d<td?' past':'')+'" style="--c:'+s.c+'" data-i="'+it.i+'"><div class="tm">'+tm(e)+' · '+e.kind+'</div><div class="nm">'+s.n+'<span class="tag">'+e.kind.split(' ')[0]+'</span></div><div class="tp">'+e.tp+(e.who&&e.s==='ZD'?' · '+e.who:'')+'</div></button>'});
$('plan').innerHTML=h;
}
function mail(m){return m.indexOf('@')>0?'<a href="mailto:'+m+'">'+m+'</a>':m}
function open_(i){
var e=E[i],s=S[e.s],h='<h2>'+s.n+'</h2><div class="sub">'+fd(e.d)+' · '+tm(e)+'</div>';
h+='<div><b>'+e.tp+'</b> ('+e.kind+')'+(e.s==='KS'?' · grupa 1'+g:'')+'</div>';
h+='<div style="margin-top:8px">Sala: <b>'+e.room+'</b></div>';if(e.note)h+='<div class="tp" style="margin-top:6px">'+e.note+'</div>';
h+='<h3>Prowadzący</h3>';
s.T.forEach(function(t){h+='<div class="t'+(e.who===t.k&&t.k?' me':'')+'">'+t.n+(t.k?' ('+t.k+')':'')+(e.who===t.k&&t.k?' · prowadzi te zajęcia':'')+'<br>'+mail(t.m)+'</div>'});
if(e.s==='ZD'&&e.who)h+='<div class="t me">'+e.who+' · prowadzi ćwiczenia tego dnia<br><span class="tp">brak danych kontaktowych</span></div>';
h+='<button class="x" id="cl">Zamknij</button>';
$('sh').innerHTML=h;$('ov').className='show';$('cl').onclick=close_;
}
function close_(){$('ov').className=''}
$('ov').onclick=function(e){if(e.target.id==='ov')close_()};
$('plan').onclick=function(ev){var c=ev.target.closest('.card');if(c)open_(+c.dataset.i)};
function sync(){
document.querySelectorAll('#gs button').forEach(function(b){b.className=b.dataset.g===g?'on':''});
document.querySelectorAll('#vs button').forEach(function(b){b.className=b.dataset.v===v?'on':''});
$('fsel').value=f;
$('plan').style.display=v==='plan'?'block':'none';
$('prow').style.display=v==='prow'?'block':'none';
$('fs').style.display=v==='plan'?'flex':'none';
}
$('gs').onclick=function(e){var b=e.target.closest('button');if(!b)return;g=b.dataset.g;try{localStorage.setItem('g',g)}catch(x){}sync();render()};
$('vs').onclick=function(e){var b=e.target.closest('button');if(!b)return;v=b.dataset.v;sync()};
var fo='<option value="all">Wszystkie przedmioty</option>';for(var key in S)fo+='<option value="'+key+'">'+S[key].n+'</option>';$('fsel').innerHTML=fo;$('fsel').onchange=function(){f=this.value;render()};
$('td').onclick=function(){var n=$('next');if(n)n.scrollIntoView({behavior:'smooth'});else window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
var ph='';OTHER.forEach(function(o){ph+='<div class="card" style="cursor:default;border-left-color:var(--ln)"><div class="nm">'+o[0]+'</div><div class="tp">'+o[1]+'<br>'+mail(o[2])+'</div></div>'});
$('prow').innerHTML='<div class="day"><div class="dh">Prowadzący – semestr V</div></div>'+ph;
sync();render();
var n=$('next');if(n)setTimeout(function(){n.scrollIntoView()},50);
</script>
</body>
</html>
